# Threvelonbase — Netlify production host
# https://docs.netlify.com/build/frameworks/framework-setup-guides/nextjs/overview/
#
# Prefer build settings from this file. Clear UI overrides if the dashboard
# forced a different command or publish directory.

[build]
  # Lint, typecheck, production build, and Node contract tests.
  command = "npm run build:netlify"
  # Publish directory for the Next.js build output. Prefer this file over
  # conflicting UI overrides so Netlify and local docs stay aligned.
  publish = ".next"

[build.environment]
  NODE_VERSION = "22.13.0"
  # Absolute SEO URLs (canonical, Open Graph, sitemap, JSON-LD). Set in UI:
  # NEXT_PUBLIC_SITE_URL = "https://your-site.netlify.app"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
