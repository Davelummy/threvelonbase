# Threvelonbase — Netlify production host
# https://docs.netlify.com/build/frameworks/framework-setup-guides/nextjs/overview/
#
# IMPORTANT: If Site settings → Build & deploy override these values, clear
# the UI overrides so this file wins (or keep UI command as `npm run build`).
# Netlify always sets NETLIFY=true, which makes `npm run build` run `next build`.

[build]
  command = "npm run build"
  # Leave publish empty for the OpenNext Next.js plugin. Do not set
  # publish = ".next" in the Netlify UI — the plugin owns the publish dir.
  publish = ".next"

[build.environment]
  NODE_VERSION = "22.13.0"
  # Absolute SEO URLs (canonical, Open Graph, sitemap, JSON-LD). Set in UI:
  # NEXT_PUBLIC_SITE_URL = "https://your-site.netlify.app"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
