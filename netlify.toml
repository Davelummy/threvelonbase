# Threvelonbase — Netlify production host
# Docs: https://docs.netlify.com/build/frameworks/framework-setup-guides/nextjs/overview/

[build]
  command = "npm run build:netlify"
  # Publish is managed by Netlify's Next.js/OpenNext adapter. Do not set
  # publish = ".next" or "out" for this App Router app.

[build.environment]
  NODE_VERSION = "22.13.0"
  # Required for correct absolute SEO URLs (canonical, Open Graph, sitemap,
  # LocalBusiness JSON-LD). Set this in the Netlify UI for each context:
  #   Production:  https://your-domain.com   or  https://your-site.netlify.app
  #   Deploy previews can omit it; SEO absolute URLs stay omitted safely.
  # NEXT_PUBLIC_SITE_URL = "https://example.com"

# Explicit Next.js runtime plugin (auto-detected on Netlify, listed so the
# intent is clear for humans and for offline `netlify build` runs).
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Long-cache hashed static assets if any are served from /assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
